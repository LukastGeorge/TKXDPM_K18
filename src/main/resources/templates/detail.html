<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tủ Sách • Khám phá kiến thức</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/books"><span class="mark">T</span> TỦ SÁCH</a><nav><a href="/books">Khám phá</a><a href="/cart">Giỏ hàng <span th:if="${cart != null}" class="count" th:text="${cart.lines().size()}">0</span></a></nav></header><main><a class="back" href="/books">← Danh mục sách</a><section class="detail"><div class="detail-cover"><img th:src="${book.coverPath()}" th:alt="${book.title()}"></div><div><span class="eyebrow" th:text="${book.category()}"></span><h1 th:text="${book.title()}"></h1><p class="author" th:text="${book.author()}"></p><p class="detail-price" th:text="${#numbers.formatDecimal(book.priceVnd(),0,'POINT',0,'COMMA')} + ' ₫'"></p><p class="description" th:text="${book.description()}"></p><dl><div><dt>Mã sách / ấn bản</dt><dd th:text="${book.sku()}"></dd></div><div><dt>Nhà xuất bản</dt><dd th:text="${book.publisher()}"></dd></div><div><dt>Tình trạng</dt><dd th:text="${book.available() > 0 ? 'Còn ' + book.available() + ' quyển' : 'Tạm hết hàng'}"></dd></div></dl><form method="post" th:action="@{/cart/{id}(id=${cart.id()})}"><input type="hidden" name="version" th:value="${cart.version()}"><input type="hidden" name="sku" th:value="${book.sku()}"><input type="hidden" name="mode" value="ADD"><label>Số lượng <input aria-label="Số lượng thêm" type="number" name="quantity" value="1" min="1" th:max="${book.available()}" required></label><button type="submit" th:disabled="${book.available() == 0}" th:text="${book.available() > 0 ? 'Thêm vào giỏ' : 'Tạm hết hàng'}">Thêm vào giỏ</button></form><p class="hint">Sách trong giỏ chưa được giữ chỗ.</p></div></section></main><footer><b>TỦ SÁCH</b><span>Không gian sách minh họa phục vụ học tập.</span><a href="/books">Khám phá sách ↗</a></footer></body></html>
