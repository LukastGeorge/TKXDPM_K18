spring.application.name=bookshop
spring.datasource.url=${BOOK_DB_URL:jdbc:postgresql://127.0.0.1:55432/bookshop}
spring.datasource.username=${BOOK_DB_USER:bookshop}
spring.datasource.password=${BOOK_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=true
server.port=${BOOK_HTTP_PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.thymeleaf.cache=false
